name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - macos
          - ubuntu
          - windows
        toolchain:
          - stable
          - 1.87.0
        features:
          - tokio1
          - std
          - pty

    name: "Test on ${{ matrix.platform }} with Rust ${{ matrix.toolchain }} (feat: ${{ matrix.features }})"
    runs-on: "${{ matrix.platform }}-latest"

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configure Rust
        run: |
          rustup toolchain install --profile minimal --no-self-update nightly
          rustup toolchain install --profile minimal --no-self-update ${{ matrix.toolchain }}
          rustup default ${{ matrix.toolchain }}
          rustup component add clippy

      - run: tests/multiproc_helper.rs 1 1

      - name: Test defaults plus frontend
        run: cargo test --locked --features ${{ matrix.features }} --all-targets

      - name: Test frontend without default wrappers
        if: matrix.toolchain == 'stable'
        run: cargo test --locked --no-default-features --features ${{ matrix.features }} --all-targets

      - run: cargo clippy --locked --features ${{ matrix.features }}

  no-default-features:
    name: Check without any features
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configure Rust
        run: |
          rustup toolchain install --profile minimal --no-self-update stable
          rustup default stable

      - run: cargo check --locked --no-default-features --lib

  all-features:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - macos
          - ubuntu
          - windows

    name: "Test all features on ${{ matrix.platform }}"
    runs-on: "${{ matrix.platform }}-latest"

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configure Rust
        run: |
          rustup toolchain install --profile minimal --no-self-update nightly
          rustup toolchain install --profile minimal --no-self-update stable
          rustup default stable

      - run: tests/multiproc_helper.rs 1 1
      - run: cargo test --locked --all-features --all-targets

  portable-unix-pty:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-ios
            toolchain: stable
          - target: aarch64-linux-android
            toolchain: stable
          - target: x86_64-unknown-freebsd
            toolchain: stable
          - target: x86_64-unknown-netbsd
            toolchain: stable
          - target: x86_64-unknown-illumos
            toolchain: stable
          - target: x86_64-pc-solaris
            toolchain: stable
          - target: x86_64-unknown-dragonfly
            toolchain: nightly
          - target: x86_64-unknown-openbsd
            toolchain: nightly

    name: "Check PTY on ${{ matrix.target }}"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configure Rust
        run: |
          rustup toolchain install --profile minimal --no-self-update ${{ matrix.toolchain }}
          rustup default ${{ matrix.toolchain }}
          if [ "${{ matrix.toolchain }}" = nightly ]; then
            rustup component add rust-src
          else
            rustup target add "${{ matrix.target }}"
          fi

      - name: Check portable Unix PTY backend
        run: |
          if [ "${{ matrix.toolchain }}" = nightly ]; then
            cargo check --locked -Zbuild-std=std --target "${{ matrix.target }}" --no-default-features --features pty --lib
          else
            cargo check --locked --target "${{ matrix.target }}" --no-default-features --features pty --lib
          fi

  rustdoc:
    name: Rustdoc
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configure Rust
        run: |
          rustup toolchain install --profile minimal --no-self-update stable
          rustup default stable

      - name: Build documentation with warnings denied
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --all-features --no-deps

      - name: Test documentation examples
        run: cargo test --locked --all-features --doc

  package:
    name: Package contents
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configure Rust
        run: |
          rustup toolchain install --profile minimal --no-self-update stable
          rustup default stable

      - name: Verify and list the release package
        run: |
          cargo package --locked
          cargo package --locked --list

  semver:
    name: Semver against PR base
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Rust
        run: |
          rustup toolchain install --profile minimal --no-self-update stable
          rustup default stable

      - name: Install cargo-semver-checks
        run: cargo install --locked --version 0.50.0 cargo-semver-checks

      - name: Check API compatibility
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          printf 'Comparing against %s at %s\n' "$BASE_REF" "$BASE_SHA"
          git cat-file -e "${BASE_SHA}^{commit}"
          cargo semver-checks check-release --all-features --baseline-rev "$BASE_SHA"

  formatting:
    name: Fmt check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configure Rust
        run: |
          rustup toolchain install --profile minimal --no-self-update stable
          rustup default stable
          rustup component add rustfmt

      - run: cargo fmt --check
